# Builds ghcr.io/drawmonster/ring-mqtt:local from upstream ring-mqtt plus the
# commits on this branch, so upstream updates arrive daily with the fixes
# reapplied. Nothing is pushed back to the repo: each run starts from upstream,
# cherry-picks this branch's own commits and publishes the image. A commit that
# no longer applies fails the run and posts to Discord.
name: Local Fixes - Sync and Build

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [local-fixes]

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: local-fixes
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/tsightler/ring-mqtt.git
  # dev carries 6.0.0, which is not on main yet. Switch to main once it is.
  UPSTREAM_REF: dev
  # The upstream commit this branch was cut from. Its own commits follow it.
  BRANCH_BASE: 996be5b
  IMAGE: ghcr.io/drawmonster/ring-mqtt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          ref: local-fixes
          fetch-depth: 0

      - name: Apply this branch's commits to upstream
        id: apply
        run: |
          git config user.name "local-fixes"
          git config user.email "local-fixes@users.noreply.github.com"
          FIXES=$(git rev-parse HEAD)
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream "$UPSTREAM_REF"
          UP=$(git rev-parse FETCH_HEAD)
          git checkout --quiet --detach "$UP"
          git cherry-pick "$BRANCH_BASE..$FIXES"
          echo "key=${UP:0:7}-${FIXES:0:7}" >> "$GITHUB_OUTPUT"
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this combination is already published
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.apply.outputs.key }}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.built == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.built == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:local
            ${{ env.IMAGE }}:${{ steps.apply.outputs.key }}
          labels: |
            org.opencontainers.image.source=https://github.com/Drawmonster/ring-mqtt
            org.opencontainers.image.revision=${{ steps.apply.outputs.upstream }}

      # GitHub disables a public repo's scheduled workflows after 60 days with no
      # commits, and this branch only changes when a fix breaks. Re-enabling the
      # workflow on every successful run resets that clock.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/local-fixes.yml/enable"

      - name: Tell Discord the build failed
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          MSG="ring-mqtt fork: the daily build failed, so the server keeps its current image. Most likely an upstream change no longer lets the local fixes apply. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -H "Content-Type: application/json" -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$DISCORD_WEBHOOK"
